<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='Log-In.css') }}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
</head>
<body>
  <!-- Login buttons Container-->
  <div class="login-container">
    <!--Header-->
    <h2>Login</h2>
    <form method="POST" action="{{ url_for('Loginpage') }}">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required> <!-- Use type="email" for better validation -->
      </div>
      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
      </div>
      <!-- Log-In Button -->
      <div class="form-group">
        <button type="submit" class="cta-button">Login</button> <!-- Move submit button inside the form -->
      </div>
    </form>
  </div>
</body>
</html>
