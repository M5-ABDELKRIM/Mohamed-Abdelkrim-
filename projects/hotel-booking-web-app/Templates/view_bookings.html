<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Bookings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='view_booking.css') }}"> <!-- Link to admin.css -->
</head>
<style></style>
<body>
    <h2>View Bookings</h2>
    <table>
        <thead>
            <tr>
                <th>Booking ID</th>
                <th>Customer ID</th>
                <th>Check-in Date</th>
                <th>Check-out Date</th>
                <th>City</th>
                <th>Room Type</th>
            </tr>
        </thead>
        <tbody>
            {% for booking in bookings %}
            <tr>
                <td>{{ booking[0] }}</td>
                <td>{{ booking[1] }}</td>
                <td>{{ booking[2] }}</td>
                <td>{{ booking[3] }}</td>
                <td>{{ booking[4] }}</td>
                <td>{{ booking[5] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
