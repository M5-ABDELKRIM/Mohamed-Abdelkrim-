<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IRDb - Admin Queue</title>
  <link rel="stylesheet" href="/frontend/common.css" />
</head>
<body class="page-app">
  <div class="container">
    <main class="page-shell">
      <div class="top-utility">
        <a href="/discovery" class="brand-home" aria-label="Go to discovery">IRDb</a>
        <div class="utility-actions">
          <button id="appearanceToggleBtn" class="utility-icon-btn" type="button" aria-label="Toggle appearance">Dark</button>
          <div class="account-menu">
            <button type="button" class="account-trigger" aria-label="Open account menu"><span class="account-trigger-icon" aria-hidden="true"></span></button>
            <div class="account-panel">
              <button id="logoutBtn" class="linkbtn" type="button">Logout</button>
            </div>
          </div>
        </div>
      </div>

      <header class="page-header">
        <div>
          <div class="kicker" style="background: rgba(184, 80, 47, 0.14); color: var(--accent-deep); border-color: transparent;">Moderation</div>
          <h1 class="page-title">Pending reviews.</h1>
          <p class="section-copy">Review the queue, leave notes when needed, and decide what gets published.</p>
        </div>
      </header>

      <section class="stats-grid" style="margin-bottom: 18px;">
        <div class="stat-card">
          <div class="muted">Pending now</div>
          <div id="pendingCount" class="title" style="margin-top: 8px;">-</div>
        </div>
        <div class="stat-card">
          <div class="muted">Restaurants affected</div>
          <div id="restaurantCount" class="title" style="margin-top: 8px;">-</div>
        </div>
        <div class="stat-card">
          <div class="muted">Average stars in queue</div>
          <div id="avgStars" class="title" style="margin-top: 8px;">-</div>
        </div>
        <div class="stat-card">
          <div class="muted">Oldest pending review</div>
          <div id="oldestPending" class="title" style="margin-top: 8px;">-</div>
        </div>
      </section>

      <section class="card">
        <h2>Pending Reviews</h2>
        <div id="list" class="muted">Loading...</div>
      </section>
    </main>
  </div>

  <script type="module" src="/frontend/admin_queue.js"></script>
</body>
</html>
